# Render Blueprint — five free web services for the Kong-fronted agentic demo.
#
#   agent-app        chat UI + orchestrator (/, /chat, /healthz)
#   billing-mcp      MCP tools governed by Reva (via Kong)
#   external-mcp     untrusted MCP (typically forbidden)
#   ticketing-agent  sub-agent as A2A (own LLM hop via Kong)
#   booking-agent    second sub-agent as A2A
#
# Tools are MCP; sub-agents speak A2A (message/send). Kong fronts /mcp/* and
# /a2a/* routes so both hops are authorized by Reva.
#
# Deploy: push this dir to a Git repo -> Render -> New -> Blueprint -> pick the repo.
# Point Kong upstreams at the four MCP/agent service URLs after deploy.
#
# Free plan note: a service sleeps after ~15 min idle and cold-starts (~40s) on the
# next request. Hit each /healthz (or /mcp) once before presenting so the first
# real call is warm.

services:
  - type: web
    name: agent-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: LLM_MODEL
        value: gpt-4o
      # Kong OpenAI-compatible LLM route and MCP proxy base (no trailing slash).
      # Set these to your Kong Cloud host paths after routes exist.
      - key: KONG_LLM_URL
        sync: false
      - key: KONG_MCP_URL
        sync: false
      # A2A base for sub-agents: each agent hangs off this as /<agent-name>.
      - key: KONG_A2A_URL
        sync: false
      - key: KONG_API_KEY
        sync: false

  - type: web
    name: billing-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python billing_mcp_server.py

  - type: web
    name: external-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python external_mcp_server.py

  - type: web
    name: ticketing-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python ticketing_agent_server.py
    envVars:
      # Sub-agent makes its own model call through Kong under identity ticketing-agent.
      - key: LLM_MODEL
        value: gpt-4o
      - key: KONG_LLM_URL
        sync: false
      - key: KONG_MCP_URL
        sync: false
      - key: KONG_API_KEY
        sync: false

  - type: web
    name: booking-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python booking_agent_server.py
