# Render Blueprint — six free web services for the Kong-fronted agentic demo.
#
#   agent-app              chat UI; /chat is a thin client to billing-support-agent
#   billing-support-agent  orchestrator: delegates to ticketing-agent / booking-agent
#   ticketing-agent        sub-agent as A2A (own LLM hop + own MCP tools via Kong)
#   booking-agent          second sub-agent, same pattern
#   ticketing-mcp          canned ticketing tools (open/close/status)
#   booking-mcp            canned booking tools (list/book)
#
# Every agent is reached over A2A (message/send); every agent's own tools are
# MCP. Kong fronts /llm, /mcp/*, and /a2a/* so every hop is authorized by Reva.
#
# Deploy: push this dir to a Git repo -> Render -> New -> Blueprint -> pick the repo.
# Point Kong upstreams at the five agent/MCP service URLs after deploy.
#
# Paste the ngrok (or Kong Cloud) URLs into each service that needs them.
# sync: false means Render prompts for them in the dashboard.
#
# Free plan note: a service sleeps after ~15 min idle and cold-starts (~40s) on the
# next request. Hit each /healthz (or /mcp) once before presenting so the first
# real call is warm.

services:
  - type: web
    name: agent-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      # /chat's one outbound hop: billing-support-agent, via Kong.
      #   KONG_A2A_URL=https://<ngrok>/a2a
      - key: KONG_A2A_URL
        sync: false
      # Non-empty so the app starts. reva-ai-governance does not check key-auth.
      - key: KONG_API_KEY
        value: not-used-by-reva-ai-governance

  - type: web
    name: billing-support-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python billing_support_agent_server.py
    envVars:
      - key: LLM_MODEL
        value: gpt-4o
      # Own model call, plus delegation to ticketing-agent/booking-agent.
      - key: KONG_LLM_URL
        sync: false
      - key: KONG_A2A_URL
        sync: false
      - key: KONG_API_KEY
        value: not-used-by-reva-ai-governance

  - type: web
    name: ticketing-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python ticketing_agent_server.py
    envVars:
      - key: LLM_MODEL
        value: gpt-4o
      # Own model call, plus calls to its own MCP tools (ticketing-mcp).
      - key: KONG_LLM_URL
        sync: false
      - key: KONG_MCP_URL
        sync: false
      - key: KONG_API_KEY
        value: not-used-by-reva-ai-governance

  - type: web
    name: booking-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python booking_agent_server.py
    envVars:
      - key: LLM_MODEL
        value: gpt-4o
      # Own model call, plus calls to its own MCP tools (booking-mcp).
      - key: KONG_LLM_URL
        sync: false
      - key: KONG_MCP_URL
        sync: false
      - key: KONG_API_KEY
        value: not-used-by-reva-ai-governance

  - type: web
    name: ticketing-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python ticketing_mcp_server.py

  - type: web
    name: booking-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python booking_mcp_server.py
